[package]
name = "oxiron"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "A lightweight, zero-dependency utility library for Rust."
license = "Apache-2.0"
repository = "https://github.com/oxiron-rs/oxiron"
homepage = "https://github.com/oxiron-rs/oxiron"
documentation = "https://docs.rs/oxiron"
readme = "README.md"
keywords = ["utility", "toolkit", "library"]
categories = ["development-tools"]

[dependencies]
oxiron-sql = { path = "crates/oxiron-sql" }
oxiron-jdbc = { path = "crates/oxiron-jdbc" }

[workspace]
members = ["crates/*"]
resolver = "3"    # Edition 2024 默认解析器
