[package]
name = "oxiron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A lightweight, zero-dependency utility library for Rust."
repository = "https://github.com/oxiron-rs/oxiron"
homepage = "https://github.com/oxiron-rs/oxiron"
documentation = "https://docs.rs/oxiron"
readme = "README.md"
keywords = ["utility", "toolkit", "library"]
categories = ["development-tools"]

# 共享元数据：子包用 `xxx.workspace = true` 继承
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"    # MSRV（见 docs/ARCHITECTURE.md D5）
license = "Apache-2.0"

[dependencies]
oxiron-sql = { path = "crates/oxiron-sql" }
oxiron-jdbc = { path = "crates/oxiron-jdbc" }

[workspace]
members = ["crates/*"]
resolver = "3"    # Edition 2024 默认解析器
