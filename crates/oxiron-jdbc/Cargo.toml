[package]
name = "oxiron-jdbc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JDBC-style database abstraction layer for the oxiron framework."

[dependencies]
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
# PostgreSQL 驱动：认证（SCRAM-SHA-256 / md5）所需的小型加密库
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
md-5 = "0.10"
