[package]
name = "oxiron-jdbc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "JDBC-style database abstraction layer for the oxiron framework."
license = "Apache-2.0"

[dependencies]
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
# PostgreSQL 驱动：认证（SCRAM-SHA-256 / md5）所需的小型加密库
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
md-5 = "0.10"
