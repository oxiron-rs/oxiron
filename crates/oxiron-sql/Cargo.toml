[package]
name = "oxiron-sql"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "MyBatis-style SQL mapper procedural macros for the oxiron framework."
license = "Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
