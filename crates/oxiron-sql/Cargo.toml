[package]
name = "oxiron-sql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MyBatis-style SQL mapper procedural macros for the oxiron framework."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# 集成测试需要真实驱动执行宏生成的代码（dev-dep 不构成依赖环：
# oxiron-jdbc 并不依赖 oxiron-sql）
[dev-dependencies]
oxiron-jdbc = { path = "../oxiron-jdbc" }
